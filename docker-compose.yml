services:
  mysql-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: YourStrongPassword123
      MYSQL_DATABASE: unigig_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build: ./unigig-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./unigig-backend/.env
    depends_on:
      - mysql-db

volumes:
  mysql-data:
