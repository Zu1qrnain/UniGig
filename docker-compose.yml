services:
  mysql-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: unigig_db
    # Port 3306 is NOT exposed to the public internet for security.
    # The backend will still connect to it on the internal Docker network.
    volumes:
      - mysql-data:/var/lib/mysql
      # Automatically run this script on the first startup to create tables
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro

  backend:
    build: ./unigig-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./unigig-backend/.env
    depends_on:
      - mysql-db

  frontend:
    build: ./unigig-frontend
    restart: always
    ports:
      # Expose frontend on standard HTTP port 80
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
